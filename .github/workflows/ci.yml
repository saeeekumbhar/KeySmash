name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build solution
      run: dotnet build --configuration Release --no-restore

    - name: Run unit tests
      run: dotnet test --configuration Release --no-build --verbosity normal

    - name: Publish standalone release
      run: dotnet publish src/KeySmash/KeySmash.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish-artifact

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: KeySmash-win-x64
        path: publish-artifact/
